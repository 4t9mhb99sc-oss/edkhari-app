<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9f8ed">
  <meta name="description" content="براعم البداية: حروف وأرقام وأشكال وحيوانات مع النطق التلقائي وحصص مستقلة للأطفال">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>براعم البداية | نتعلّم ونكبر</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="homeBtn" class="brand" aria-label="العودة للرئيسية"><span class="brand-leaf">✿</span><span>براعم <small>البداية</small></span></button>
      <div class="top-actions">
        <span id="personTag" class="person-tag" hidden>🌼 ترف</span>
        <span id="timerTag" class="timer-tag" hidden>⏳ 00:00</span>
        <button id="parentBtn" class="parent-nav">⚙️ ولي الأمر</button>
      </div>
    </header>
    <main id="screen" aria-live="polite"></main>
    <footer class="app-footer">كل محاولة خطوة جميلة 🌱 تعلّم باللعب، على مهل.</footer>
  </div>
  <div id="modalLayer" class="modal-layer" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <audio id="narration" preload="auto" playsinline></audio>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
